<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Магазин Оранжевого настроения</title>
    <!-- Подключаем CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Анимация для логотипа -->
<style>
    .brand-animated {
        transition: all 0.3s ease-in-out;
    }
    
    .brand-animated:hover {
        transform: scale(1.02);
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.7); /* Мягкое белое свечение */
    }
    
    .brand-animated:active {
        transform: scale(0.97); /* Эффект вдавливания */
        text-shadow: none;
    }

    .brand-emoji {
        display: inline-block;
        transition: transform 0.3s ease;
    }

    .brand-animated:hover .brand-emoji {
        transform: rotate(15deg) scale(1.1); /* Апельсин немного поворачивается и растет */
    }
</style>
<!-- Ваша обновленная навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to bottom, #ff8c1a, #cc5200); box-shadow: 0 4px 6px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.2);">
    <div class="container">
        <!-- Обновленный логотип с новыми классами -->
        <a class="navbar-brand fw-bold d-flex align-items-center brand-animated" href="/">
            <span class="fs-3 me-2 brand-emoji">🍊</span> 
            Магазин Оранжевого настроения
        </a>
        
            <div class="d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-white me-3">Привет, <strong>{{ user.username }}</strong>!</span>
                    <a href="{% url 'profile' %}" class="btn btn-outline-light btn-sm me-2">Мой профиль</a>
                    
                    <form action="{% url 'logout' %}" method="POST" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">Выйти</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Войти</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Регистрация</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Основной контейнер для контента страниц -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подключаем JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Подвал сайта -->
    <footer class="mt-5 py-4 border-top" style="background-color: #f8f9fa;">
        <div class="container text-center text-muted">
            <p class="mb-0 fs-6">
                &copy; 2026 Бойбородов Илья Олегович. Магазин Оранжевого настроения.
            </p>
        </div>
    </footer>
</body>
</body>
</html>
