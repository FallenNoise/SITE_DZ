<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавить товар</title>
</head>
<body>
    <h1>Добавление нового товара</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить товар</button>
    </form>
    
    <br>
    <a href="{% url 'index' %}">Вернуться к списку товаров</a>
</body>
</html>
