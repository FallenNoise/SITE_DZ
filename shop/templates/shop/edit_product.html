<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование товара</title>
</head>
<body>
    <h1>Редактировать товар: {{ product.name }}</h1>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить изменения</button>
    </form>
    
    <br>
    
    <a href="{% url 'index' %}">Отмена и возврат в каталог</a>
</body>
</html>
