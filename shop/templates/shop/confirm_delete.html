{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white text-center">
                <h4 class="mb-0">Подтверждение удаления</h4>
            </div>
            <div class="card-body p-4 text-center">
                <p class="fs-5 mb-4">Вы действительно хотите удалить товар <strong>«{{ product.name }}»</strong>?</p>
                <p class="text-muted small">Это действие необратимо.</p>
                
                <form method="POST" class="d-flex justify-content-center gap-3 mt-4">
                    {% csrf_token %}
                    <a href="/" class="btn btn-outline-secondary px-4">Отмена</a>
                    <button type="submit" class="btn btn-danger px-4">Да, удалить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
