<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Главная - Интернет-магазин</title>
    <style>
        .product-title-link {
            color: #0066cc; 
            text-decoration: none; 
            transition: color 0.2s ease-in-out; 
        }
        .product-title-link:hover {
            color: #003366; 
        }
    </style>
  </head>
  <body>
    
    <a href="{% url 'add_product' %}">Добавить новый товар</a>
    <h1>Каталог товаров</h1>
    <hr />
<div style="display: flex; gap: 20px; flex-wrap: wrap">
    {% for product in products %}
    <div 
        style="
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 5px;
            width: 250px;
        "
    >
        <h3>
            <a href="{% url 'product_detail' product.id %}" class="product-title-link">
        {{ product.name }}
            </a>
        </h3>
        <p>{{ product.description|truncatewords:20 }}</p>
        <p><strong>Цена: {{ product.price }} руб.</strong></p>
        
        
        <br>
        <a href="{% url 'product_detail' product.id %}">Подробнее</a>
        <a href="{% url 'edit_product' product.id %}">Редактировать</a> | 
        <a href="{% url 'delete_product' product.id %}" style="color: red;">Удалить</a>
    </div>
    {% empty %}
    <p>В магазине пока нет товаров.</p>
    {% endfor %}
</div>
    </div>
  </body>
</html>
